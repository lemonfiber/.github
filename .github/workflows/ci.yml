# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A job-level block replaces the workflow-level default
  # outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
