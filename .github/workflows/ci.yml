# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A job-level block replaces the workflow-level default
  # outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@c85e51064881149396a84f91ac05f0c694e4e4ca # v1.0.12
