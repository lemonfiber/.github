# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A job-level block replaces the workflow-level default
  # outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@a57b350760f7bbc3d2dc14fe5306002de323bc1c # v1.0.40
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@a57b350760f7bbc3d2dc14fe5306002de323bc1c # v1.0.40
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@92ec12769c3fdebc6063a839e9ea7c8bc23e6d3d # v1.0.31
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@92ec12769c3fdebc6063a839e9ea7c8bc23e6d3d # v1.0.31
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@92ec12769c3fdebc6063a839e9ea7c8bc23e6d3d # v1.0.31
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@92ec12769c3fdebc6063a839e9ea7c8bc23e6d3d # v1.0.31
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@92ec12769c3fdebc6063a839e9ea7c8bc23e6d3d # v1.0.31
