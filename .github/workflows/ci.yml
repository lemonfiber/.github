# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A job-level block replaces the workflow-level default
  # outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@8fea1245cc04e51177d19c592336379d63638da7 # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@8fea1245cc04e51177d19c592336379d63638da7 # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@8fea1245cc04e51177d19c592336379d63638da7 # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@8fea1245cc04e51177d19c592336379d63638da7 # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@8fea1245cc04e51177d19c592336379d63638da7 # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@8fea1245cc04e51177d19c592336379d63638da7 # main
